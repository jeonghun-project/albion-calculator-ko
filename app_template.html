<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알비온 제작 계산기</title>
<style>
:root{
  --bg:#12151b; --bg2:#181c24; --panel:#1e232d; --panel2:#252b37; --line:#2f3644;
  --tx:#e6e9ef; --tx2:#9aa4b8; --tx3:#6b7488;
  --acc:#d9a441; --acc2:#f0c26b;
  --up:#4ec98a; --dn:#e5695f; --warn:#e0a458;
  --t4:#7fa8d4; --t5:#d46b6b; --t6:#d99a4e; --t7:#5fc4a8; --t8:#c9cdd6;
  --e1:#3f7f5f; --e2:#3f6f9f; --e3:#8f5faf; --e4:#b08040;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx); font:13px/1.5 "Pretendard","Apple SD Gothic Neo",
  "Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc2)}

/* ── 헤더 ───────────────────────────────── */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
}
.logo{font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--acc2);white-space:nowrap}
.logo span{color:var(--tx3);font-weight:400;font-size:11px;margin-left:6px}
.hspace{flex:1}
.status{font-size:11px;color:var(--tx3);white-space:nowrap}
.status b{color:var(--tx2);font-weight:600}

/* ── 폼 요소 ────────────────────────────── */
.field{display:flex;flex-direction:column;gap:3px}
.field>label{font-size:10.5px;color:var(--tx3);letter-spacing:.02em}
select,input[type=text],input[type=number],input[type=search]{
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:5px 7px;outline:none;min-width:0;
}
select:focus,input:focus{border-color:var(--acc)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 12px;
}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1408;font-weight:700}
.btn.pri:hover{background:var(--acc2);color:#1a1408}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:5px 10px;color:var(--tx2);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#1a1408;font-weight:700}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);width:14px;height:14px}

/* ── 레이아웃 ───────────────────────────── */
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 49px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
aside{border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
main{overflow-y:auto;padding:14px 16px 60px}

/* ── 사이드바 ───────────────────────────── */
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{
  flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  padding:8px 9px;color:var(--tx3);font-size:12px;white-space:nowrap;
}
.tabs button.on{color:var(--acc2);border-bottom-color:var(--acc);font-weight:700}
.sbar{padding:9px 10px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;border-bottom:1px solid var(--line)}
.sbar input[type=search]{width:100%}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.pill{
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:2px 9px;font-size:11px;color:var(--tx3);
}
.pill.on{background:var(--acc);border-color:var(--acc);color:#1a1408;font-weight:700}
.list{overflow-y:auto;flex:1;min-height:240px}
.row{
  display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;
  border-left:2px solid transparent;
}
.row:hover{background:var(--panel)}
.row.on{background:var(--panel);border-left-color:var(--acc)}
.row img{width:30px;height:30px;flex-shrink:0;image-rendering:auto}
.row .nm{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:10px;color:var(--tx3)}
.tier{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--panel2)}
.more{padding:10px;text-align:center;color:var(--tx3);font-size:11px}

/* ── 설정 바 ────────────────────────────── */
.cfg{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;margin-bottom:14px;
}
.cfg h3{margin:0 0 9px;font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.06em}
.cfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px 12px}
.cfgrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}

/* ── 결과 ───────────────────────────────── */
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head img{width:56px;height:56px}
.head h2{margin:0;font-size:18px;letter-spacing:-.02em}
.head .en{font-size:11px;color:var(--tx3)}
.badges{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:1.5px 6px;border-radius:3px;background:var(--panel2);color:var(--tx2)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.card .k{font-size:10.5px;color:var(--tx3);margin-bottom:3px}
.card .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .n{font-size:10.5px;color:var(--tx3);margin-top:2px}
.card.big{grid-column:span 2}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--tx3)}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{
  text-align:right;font-size:10.5px;color:var(--tx3);font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th:first-child{text-align:left}
td{padding:4px 8px;text-align:right;border-bottom:1px solid #232936;font-size:12px}
td:first-child{text-align:left}
tbody tr:hover{background:#1b202a}
.mat{display:flex;align-items:center;gap:7px}
.mat img{width:26px;height:26px;flex-shrink:0}
.mat .tw{min-width:0}
.mat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.mat .id{font-size:9.5px;color:var(--tx3);font-family:ui-monospace,Menlo,monospace}
.indent{display:inline-block;width:16px}
td input[type=number]{width:88px;padding:2px 5px;font-size:11.5px}
.tag{font-size:9.5px;padding:1px 5px;border-radius:3px;background:var(--panel2);
  color:var(--tx3);margin-left:5px;white-space:nowrap;display:inline-block}
.row img,.mat img,.head img{background:#232936;border-radius:4px}
.tag.craft{background:#2b3a2f;color:var(--up)}
.tag.nr{background:#3a2b2b;color:var(--dn)}
.stale{color:var(--warn)}
.tag.alt{background:#2a3550;color:#8fb4e8}
.tag.q2{background:#24402c;color:#8fd0a0}
.tag.q3{background:#1f3a4a;color:#8ec4dd}
.tag.q4{background:#3a2f4d;color:#c0a6e0}
.tag.q5{background:#4a3a1f;color:#e0c07a}
.alt2{color:#8fb4e8}
.journey{display:flex;flex-direction:column;gap:7px}
.stop{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px}
.jnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--acc);
  color:#1a1408;font-weight:700;font-size:12px;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.jbody{flex:1;min-width:0}
.jcity{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;margin-bottom:4px}
.jline{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;margin:2px 0}
.jlabel{flex-shrink:0;font-size:10.5px;color:var(--tx3);width:30px;padding-top:3px}
.jitem{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
  background:var(--panel2);border-radius:5px;padding:2px 7px}
.jitem img{width:18px;height:18px;border-radius:3px}
.hint{margin-top:5px;font-size:11.5px;color:#e8d5a8;background:#3a3320;
  border:1px solid #5c5030;border-radius:5px;padding:6px 9px;line-height:1.6}
.hint b{color:var(--acc2)}
.mini{background:none;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:10.5px;color:var(--tx2)}
.mini:hover{border-color:var(--acc);color:var(--acc2)}
.mini.on{background:var(--acc);border-color:var(--acc);color:#1a1408;font-weight:700}
.mini.lvS{background:#9aa4b8;border-color:#9aa4b8;color:#14171d;font-weight:700}
.mini.lvG{background:var(--acc);border-color:var(--acc);color:#1a1408;font-weight:700}

.sec{margin:18px 0 8px;font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.06em;
  display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:13px;line-height:2}
.note{font-size:11px;color:var(--tx3);line-height:1.8;margin-top:16px;
  border-top:1px solid var(--line);padding-top:12px}
.note b{color:var(--tx2)}
.err{background:#3a2222;border:1px solid #6b3a3a;color:#f0b0aa;padding:8px 11px;
  border-radius:6px;font-size:12px;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <div class="logo">알비온 제작 계산기<span>정제 · 제작 · 음식 · 물약</span></div>
  <div class="field" style="width:120px">
    <label>서버</label>
    <select id="server">
      <option value="east">아시아</option>
      <option value="west">아메리카</option>
      <option value="europe">유럽</option>
    </select>
  </div>
  <button class="btn pri" id="refresh">시세 새로고침</button>
  <div class="hspace"></div>
  <div class="status" id="status">데이터 대기 중</div>
</header>

<div class="wrap">
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="sbar">
      <input type="search" id="q" placeholder="한글/영문/아이템ID 검색 (예: 판자, 브로드소드)" autocomplete="off">
      <div class="filters" id="tierf"></div>
      <div class="filters" id="enchf"></div>
      <button class="btn" data-scanrun="1">이 조건으로 수익 후보 탐색</button>
      <button class="btn" data-circuitrun="1">도시별 정제 순회</button>
      <button class="btn pri" data-todorun="1">오늘 할 일</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>

<script id="albion-data" type="application/json">__ALBION_DATA__</script>
<script>
/* ══════════════════════════════════════════════════════════════════
   알비온 제작 계산기 — 데이터: ao-data/ao-bin-dumps
   시세: Albion Online Data Project (albion-online-data.com)
   Sandbox Interactive GmbH 와 무관한 비공식 도구입니다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const DATA  = JSON.parse(document.getElementById('albion-data').textContent);
const ITEMS = DATA.items;
const IX    = new Map(ITEMS.map(r => [r.id, r]));
ITEMS.sort((a,b) =>
  (a.t||99) - (b.t||99) || (a.e||0) - (b.e||0) ||
  (a.ko||'').localeCompare(b.ko||'', 'ko'));

/* ── 도시 ─────────────────────────────────────────────────────── */
const CITIES = [
  ['Martlock','마틀록'], ['Lymhurst','림허스트'], ['Bridgewatch','브릿지워치'],
  ['Fort Sterling','포트 스털링'], ['Thetford','셋포드'],
  ['Caerleon','카를레온'], ['Brecilien','브레실리엔'],
];
const BLACK_MARKET = 'Black Market';
/* 암시장은 카를레온에만 있다. 판매처로만 고를 수 있고, 장비류만 거래된다 */
const AUTO_VENUE = 'AUTO';
const SELL_CITIES = [[AUTO_VENUE, '자동 — 최고 실수령'], ...CITIES,
                     [BLACK_MARKET, '암시장 (카를레온)']];
const CITY_KO = Object.fromEntries(SELL_CITIES);
const isBM = c => c === BLACK_MARKET;
const isAuto = () => cfg.sellCity === AUTO_VENUE;
/* 암시장이 사들이는 것은 장비류뿐 */
const BM_SELLS = r => ['weapons','offhands','armors','head','shoes','bags','capes','artefacts']
  .includes(r.sc);

/* 정제 특화 도시 (+40%) */
const REFINE_CITY = { wood:'Fort Sterling', ore:'Thetford', hide:'Martlock',
                      fiber:'Lymhurst', rock:'Bridgewatch' };
/* 제작 특화 도시 (+15%) */
const CRAFT_CITY = {
  axe:'Martlock', quarterstaff:'Martlock', froststaff:'Martlock',
  plate_shoes:'Martlock', offhand:'Martlock',
  crossbow:'Bridgewatch', dagger:'Bridgewatch', cursestaff:'Bridgewatch',
  plate_armor:'Bridgewatch', cloth_shoes:'Bridgewatch',
  sword:'Lymhurst', bow:'Lymhurst', arcanestaff:'Lymhurst',
  leather_helmet:'Lymhurst', leather_shoes:'Lymhurst',
  hammer:'Fort Sterling', spear:'Fort Sterling', holystaff:'Fort Sterling',
  cloth_armor:'Fort Sterling', plate_helmet:'Fort Sterling',
  mace:'Thetford', naturestaff:'Thetford', firestaff:'Thetford',
  leather_armor:'Thetford', cloth_helmet:'Thetford',
};
const isRefineCat = cc => cc in REFINE_CITY;
const bonusCityOf = r => REFINE_CITY[r.cc] || CRAFT_CITY[r.cc] || null;

/* 분해: 상위 티어를 하위로 쪼개는 레시피 (연금 재료 분해 등). 표기 구분용 */
const isConvert = r => {
  if(!r || r.m.length !== 1 || r.a <= 1 || r.f !== 0) return false;
  const src = IX.get(r.m[0][0]);
  return !!src && (src.t || 0) > 0;
};
const convertsDown = (id, r) => {
  if(!isConvert(r)) return false;
  const out = IX.get(id), src = IX.get(r.m[0][0]);
  return !!out && !!src && (src.t || 0) > (out.t || 0);
};

/* 자원 반환 여부는 게임 데이터가 직접 알려준다.
   레시피 재료의 maxreturnamount=0 이면 그 재료는 반환되지 않는다(빌드 시 세 번째 원소로 표시).
   데이터에 표시가 빠진 극소수는 이름으로 보완한다. */
const noReturn = (id, flag) => !!flag || id.includes('ARTEFACT') ||
                       id.includes('TOKEN') || id.startsWith('QUESTITEM');

/* ── 카테고리 탭 ──────────────────────────────────────────────── */
const LIST_MAX = 60;   // 목록에 한 번에 뿌리는 개수 (아이콘 요청이 밀리지 않는 선)

const TABS = [
  ['refine', '정제·재료', r => r.sc === 'crafting' || r.sc === 'farming'],
  ['weapon', '무기',     r => r.sc === 'weapons' || r.sc === 'offhands' ||
                              (r.sc === 'artefacts' && (r.s1 === 'weapons' || r.s1 === 'offhands'))],
  ['armor',  '방어구',   r => ['armors','head','shoes'].includes(r.sc) ||
                              (r.sc === 'artefacts' && ['armors','head','shoes'].includes(r.s1))],
  ['acc',    '가방·망토', r => r.sc === 'bags' || r.sc === 'capes' ||
                              (r.sc === 'artefacts' && r.s1 === 'capes')],
  ['food',   '음식',     r => r.sc === 'consumables' && r.s1 === 'food'],
  ['potion', '물약',     r => r.sc === 'consumables' && r.s1 === 'potions'],
  ['mount',  '탈것',     r => r.sc === 'mounts'],
  ['tool',   '채집·도구', r => r.sc === 'gathering'],
  ['all',    '전체',     () => true],
];

/* ── 설정 ─────────────────────────────────────────────────────── */
const DEF = {
  server:'east', buyCity:'Martlock', sellCity:'Martlock',
  station:'bonus',        // island | city | bonus | hideout
  focus:false, fce:0, extra:0,
  dailyCats:{},                     // 오늘 일일 보너스가 걸린 카테고리 → 10(실버) | 20(골드)
  premium:true, sellMode:'order',   // order | instant
  crossCity:true,                   // 고른 도시에 시세가 없으면 다른 도시 값으로 대체
  minVol:0, maxDev:0, minProfit:0,  // 탐색 임계값 (거래량·평균比 이탈·개당 이익)
  chainDepth:'best',                // 정제 순회의 체인 깊이 (0·1·2·3 또는 best)
  sellShare:15,                     // 하루 거래량 대비 몇 %까지 걸 것인가 (10~20% 권장)
  buyMode:'instant',                // instant | order
  fee:800, qty:100, quality:1,
};
const cfg = Object.assign({}, DEF, JSON.parse(localStorage.getItem('ao_cfg') || '{}'));
const saveCfg = () => localStorage.setItem('ao_cfg', JSON.stringify(cfg));

let sel        = localStorage.getItem('ao_sel') || 'T4_PLANKS';
let tab        = 'refine';
let tierF      = 0, enchF = -1, query = '';
const craftSet = new Set(JSON.parse(localStorage.getItem('ao_craft') || '[]'));
const recipePick = new Map();
const override = new Map(Object.entries(JSON.parse(localStorage.getItem('ao_ovr') || '{}')));
const saveCraft = () => localStorage.setItem('ao_craft', JSON.stringify([...craftSet]));
const saveOvr   = () => localStorage.setItem('ao_ovr',
                    JSON.stringify(Object.fromEntries(override)));

/* ── 시세 캐시 ────────────────────────────────────────────────── */
const prices = new Map();          // `${id}|${city}|${q}` -> {s,b,sd,bd}
const pkey = (id, city, q) => `${id}|${city}|${q}`;
/* 시세 추이 — 하루 단위 집계라 세션 동안 다시 받지 않는다 */
const hist = new Map();            // `${id}|${city}|${q}` -> {avg, vol, days}
let fetching = false, lastFetch = null;

/* ══ 유틸 ═══════════════════════════════════════════════════════ */
const fmt  = n => !isFinite(n) ? '—' : Math.round(n).toLocaleString('ko-KR');
const fmt1 = n => !isFinite(n) ? '—' : n.toLocaleString('ko-KR',{maximumFractionDigits:1});
const pct  = n => !isFinite(n) ? '—' : (n*100).toFixed(1) + '%';
/* 수량 표기 — 1 미만이면 유효숫자를 살려 0 으로 뭉개지지 않게 한다 */
const fmtQ = n => !isFinite(n) ? '—' : n === 0 ? '0'
  : Math.abs(n) >= 100 ? Math.round(n).toLocaleString('ko-KR')
  : Math.abs(n) >= 1   ? n.toLocaleString('ko-KR', {maximumFractionDigits: 2})
  :                      n.toLocaleString('ko-KR', {maximumSignificantDigits: 2});
const esc  = s => String(s).replace(/[&<>"]/g, c =>
                  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = id =>
  `https://render.albiononline.com/v1/item/${encodeURIComponent(id)}.png?size=64&quality=1`;
/* ── 아이콘 로더 ────────────────────────────────────────────────
   render.albiononline.com 은 동시 요청이 몰리면 대부분 502 로 죽는다
   (동시 50건 중 48건 실패, 4건씩이면 24건 중 22건 성공).
   그래서 4개씩만 큐로 흘려보내고 실패하면 간격을 늘려 재시도한다.
   화면에 들어온 것만 요청하며, 응답에 max-age=86400 이 붙어 있어
   한 번 성공하면 하루는 다시 받지 않는다. */
const ICON_MAX = 4, ICON_TRIES = 5;
let iconBusy = 0;
const iconQueue = [];
const iconDone  = new Set();

function iconPump(){
  while(iconBusy < ICON_MAX && iconQueue.length){
    const job = iconQueue.shift();
    const el = job.el;
    if(!el.isConnected) continue;
    iconBusy++;
    const clear = () => { el.onload = el.onerror = null; iconBusy--; iconPump(); };
    el.onload  = () => { iconDone.add(job.url); clear(); };
    el.onerror = () => {
      clear();
      if(++job.n < ICON_TRIES){
        setTimeout(() => { iconQueue.push(job); iconPump(); },
                   700 * Math.pow(2, job.n) + Math.random() * 700);
      } else {
        el.style.visibility = 'hidden';
      }
    };
    el.src = job.url;
  }
}
function iconLoad(el){
  const id = el.dataset.ico;
  if(!id || el.src) return;
  const url = icon(id);
  if(iconDone.has(url)){ el.src = url; return; }   // 캐시에 있으면 즉시
  iconQueue.push({ el, id, url, n: 0 });
  iconPump();
}
const iconObs = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => {
      for(const e of es){
        if(!e.isIntersecting) continue;
        iconObs.unobserve(e.target);
        iconLoad(e.target);
      }
    }, { rootMargin: '250px' })
  : null;
/* 다시 그린 뒤 화면에 들어온 아이콘만 큐에 넣는다 */
function hydrateIcons(root){
  for(const el of (root || document).querySelectorAll('img[data-ico]')){
    if(el.src) continue;
    iconObs ? iconObs.observe(el) : iconLoad(el);
  }
}

function nameOf(id){
  const r = IX.get(id);
  if(!r) return id;
  return r.e ? `${r.ko} .${r.e}` : r.ko;
}
function tierLabel(r){
  return 'T' + (r.t || '?') + (r.e ? '.' + r.e : '');
}
function ago(d){
  if(!d) return null;
  const h = (Date.now() - new Date(d + 'Z').getTime()) / 36e5;
  if(h < 0 || !isFinite(h)) return null;
  if(h < 1)  return Math.round(h*60) + '분 전';
  if(h < 48) return Math.round(h) + '시간 전';
  return Math.round(h/24) + '일 전';
}
function staleH(d){
  if(!d) return Infinity;
  return (Date.now() - new Date(d + 'Z').getTime()) / 36e5;
}

/* ══ 반환율 ═════════════════════════════════════════════════════
   RRR = B / (1 + B)  —  B는 보너스 합(가산)
   도시 기본 +18% / 정제 특화 +40% / 제작 특화 +15% / 집중 +59%      */
function bonusSum(rec){
  let b = 0;
  if(cfg.station === 'city' || cfg.station === 'hideout') b += 0.18;
  else if(cfg.station === 'bonus') b += 0.18 + (isRefineCat(rec.cc) ? 0.40 : 0.15);
  if(cfg.focus) b += 0.59;
  // 일일 보너스는 그날 뽑힌 카테고리에만 붙는다 (실버 +10% / 골드 +20%)
  b += ((cfg.dailyCats || {})[rec.cc] || 0) / 100 + cfg.extra / 100;
  return b;
}
const returnRate = rec => { const b = bonusSum(rec); return b / (1 + b); };
const matMult    = rec => 1 / (1 + bonusSum(rec));   // 실제 소모 배수
const focusMult  = () => Math.pow(0.5, (cfg.fce || 0) / 10000);

/* ══ 가격 ═══════════════════════════════════════════════════════
   시세는 모든 도시를 한 번에 받아 둔다. 한 도시만 보면 아시아 서버에서는
   T5 무기 80종 중 19종밖에 값이 안 잡히는데, 전 도시를 보면 61종이 잡힌다
   (요청 수는 그대로고 전송량만 6KB → 27KB 늘어난다).
   고른 도시에 값이 없으면 다른 도시 값으로 대신하고 어디 값인지 표시한다. */
const PRICE_CITIES = [...CITIES.map(c => c[0]), BLACK_MARKET];

function rawPrice(id, city, q = 1){
  return prices.get(pkey(id, city, q)) || null;
}
/** 그 도시·그 품질에 실제로 값이 있는지 (일반 품질로 대체된 경우와 구분) */
function rawPriceAt(id, city, q){
  if(!city) return null;
  const p = prices.get(pkey(id, city, q));
  return p && (p.s || p.b) ? p : null;
}
const QUALITIES  = [1, 2, 3, 4, 5];
const QUALITY_KO = { 1:'일반', 2:'좋음', 3:'뛰어남', 4:'훌륭함', 5:'걸작' };
/** 값이 있는 도시 중 가장 싼(재료) / 가장 비싼(완제품) 곳을 찾는다 */
function bestCity(id, q, field, cheapest){
  let best = null;
  for(const c of CITIES.map(x => x[0])){        // 암시장은 대체 대상에서 뺀다
    const p = rawPrice(id, c, q) || (q !== 1 ? rawPrice(id, c, 1) : null);
    const v = p && p[field];
    if(!v) continue;
    if(!best || (cheapest ? v < best.v : v > best.v)) best = { v, city: c, p };
  }
  return best;
}
/** 현재 주문이 아예 없을 때 쓸 7일 거래량 가중 평균 (거래가 활발한 재료에 유용).
   아시아 서버의 T4_HIDE 는 현재 시세가 2개 도시뿐인데 7일 추이는 7개 도시에
   다 있고 거래량이 하루 38만이다 — 시장이 없는 게 아니라 스냅샷만 빈 것이다. */
function histPrice(id){
  const pick = c => { const h = hist7(id, c, 1); return h && isFinite(h.avg) && h.avg ? h : null; };
  const mine = pick(cfg.buyCity);
  if(mine) return { v: mine.avg, city: cfg.buyCity };
  let best = null;
  for(const c of CITIES.map(x => x[0])){
    const h = pick(c);
    if(h && (!best || h.avg < best.v)) best = { v: h.avg, city: c };
  }
  return best;
}
/** 재료 매입가 */
function buyPrice(id){
  if(override.has(id)) return { v: +override.get(id), src: 'manual' };
  const field = cfg.buyMode === 'instant' ? 's' : 'b';
  const dfield = cfg.buyMode === 'instant' ? 'sd' : 'bd';
  const p = rawPrice(id, cfg.buyCity, 1);
  if(p && p[field])
    return { v: p[field], src: cfg.buyMode, date: p[dfield], city: cfg.buyCity };
  if(!cfg.crossCity) return { v: NaN, src: 'none' };
  const alt = bestCity(id, 1, field, true);          // 가장 싼 도시
  if(alt)
    return { v: alt.v, src: cfg.buyMode, date: alt.p[dfield], city: alt.city, alt: true };
  // 어느 도시에도 현재 주문이 없으면 7일 평균으로 보완한다
  const h = histPrice(id);
  if(h) return { v: h.v, src: 'hist', city: h.city, hist: true };
  return { v: NaN, src: 'none' };
}
/** 완제품 판매가 — v 는 표시가, net 은 세후 실수령 */
function sellPrice(id, quality){
  const q = +(quality ?? cfg.quality);
  if(override.has('SELL:' + id)){
    const v = +override.get('SELL:' + id);
    // 자동 모드에서도 어느 판매처 기준인지는 남겨야 거래량·피크가를 계속 볼 수 있다
    let city = cfg.sellCity, mode = cfg.sellMode;
    if(isAuto()){
      const opts = venueOptions(id, q);
      const best = opts.length ? opts.reduce((a, b) => b.net > a.net ? b : a) : null;
      city = best ? best.city : null;
      mode = best ? best.mode : cfg.sellMode;
    }
    return { v, net: netOf(v, mode), src:'manual', city, mode };
  }
  // 자동: 실수령이 가장 큰 (도시 × 판매방식) 을 고른다
  if(isAuto()){
    const opts = venueOptions(id, q);
    if(!opts.length) return { v: NaN, net: NaN, src:'none' };
    const best = opts.reduce((a, b) => b.net > a.net ? b : a);
    return { ...best, src: best.mode, auto: true };
  }
  const instant = cfg.sellMode === 'instant';
  const field = instant ? 'b' : 's', dfield = instant ? 'bd' : 'sd';
  const p = rawPrice(id, cfg.sellCity, q) || rawPrice(id, cfg.sellCity, 1);
  if(p && p[field])
    return { v: p[field], net: netOf(p[field], cfg.sellMode), src: cfg.sellMode,
             date: p[dfield], city: cfg.sellCity, mode: cfg.sellMode };
  // 암시장은 가격 성격이 달라 royal 도시로 대체하지 않는다
  if(!cfg.crossCity || isBM(cfg.sellCity)) return { v: NaN, net: NaN, src:'none' };
  const alt = bestCity(id, q, field, false);   // 가장 비싼 도시
  if(!alt) return { v: NaN, net: NaN, src:'none' };
  return { v: alt.v, net: netOf(alt.v, cfg.sellMode), src: cfg.sellMode,
           date: alt.p[dfield], city: alt.city, mode: cfg.sellMode, alt: true };
}
const salesTax = () => cfg.premium ? 0.04 : 0.08;
const feeOf    = mode => mode === 'order' ? 0.025 : 0;   // 판매 주문 등록비
const setupFee = () => feeOf(cfg.sellMode);
/** 표시가 → 세금·등록비를 뺀 실수령 */
const netOf = (gross, mode) => gross * (1 - salesTax() - feeOf(mode));

/** 팔 수 있는 모든 (도시 × 판매방식) 후보와 각각의 실수령 */
function venueOptions(id, quality){
  const rec = IX.get(id);
  const q = +(quality ?? cfg.quality);
  const out = [];
  const add = (city, p) => {
    if(!p) return;
    if(p.s) out.push({ city, mode:'order',   v:p.s, net:netOf(p.s,'order'),   date:p.sd });
    if(p.b) out.push({ city, mode:'instant', v:p.b, net:netOf(p.b,'instant'), date:p.bd });
  };
  for(const c of CITIES.map(x => x[0]))
    add(c, rawPrice(id, c, q) || rawPrice(id, c, 1));
  // 암시장은 장비류만 거래된다
  if(rec && BM_SELLS(rec))
    add(BLACK_MARKET, rawPrice(id, BLACK_MARKET, q) || rawPrice(id, BLACK_MARKET, 1));
  return out;
}

/* ══ 원가 엔진 ══════════════════════════════════════════════════ */
function recipeOf(id){
  const r = IX.get(id);
  if(!r || !r.r || !r.r.length) return null;
  const i = Math.min(recipePick.get(id) ?? 0, r.r.length - 1);
  return r.r[i];
}
const canCraft = id => !!recipeOf(id);
const willCraft = (id, depth) => depth === 0 || (canCraft(id) && craftSet.has(id));
/* 시장에 안 올라오는 재료(인챈트된 완제품·중간재)는 '구매'로 두면 원가가 통째로 비어버린다.
   살 수 없고 만들 수는 있으면 제작 원가로 대신한다 — 이래야 룬 인챈트 경로처럼
   아래 단계 완제품을 쓰는 레시피도 값이 나온다. */
const priceless = id => { const v = buyPrice(id).v; return !isFinite(v) || !v; };
const autoCraft = (id, depth) => !willCraft(id, depth) && canCraft(id) && priceless(id);
const useCraft  = (id, depth) => willCraft(id, depth) || autoCraft(id, depth);

/** 한 개당 원가를 재귀 계산하고 트리 노드를 채운다 */
function unitCost(id, depth, stack, out){
  const rec = IX.get(id);
  if(!rec) return { cost: NaN, focus: 0, fame: 0, fee: 0 };

  if(!useCraft(id, depth) || stack.has(id)){
    const bp = buyPrice(id);
    return { cost: bp.v, focus: 0, fame: 0, fee: 0, buy: true };
  }
  const r = recipeOf(id);
  stack.add(id);
  const mult = matMult(rec);
  let mats = 0, focus = 0, fame = 0, fee = 0;
  const kids = [];
  for(const [mid, cnt, nr] of r.m){
    const per  = cnt / r.a;                                  // 완제품 1개당 기본 소모
    const need = per * (noReturn(mid, nr) ? 1 : mult);       // 반환 적용 후 실소모
    const sub  = unitCost(mid, depth + 1, stack, out);
    mats  += sub.cost * need;
    focus += sub.focus * need;
    fame  += sub.fame  * need + (IX.get(mid)?.fv || 0) * per;
    fee   += sub.fee   * need;
    kids.push({ id: mid, per, need, unit: sub.cost, total: sub.cost * need,
                buy: sub.buy, depth: depth + 1 });
  }
  stack.delete(id);
  // 인챈트(업그레이드) 경로는 게임 데이터의 upgraderequirements 에 재료만 있고
  // craftingrequirements 와 달리 time·silver·craftingfocus 가 아예 없다.
  // 제작소 사용료는 제작 시간(영양 소모)에 걸리는 값이므로 이 경로엔 붙이지 않는다.
  const myFee   = r.up ? 0 : 0.1125 * (rec.iv || 0) * (cfg.fee / 100);
  const myFocus = (r.f / r.a) * focusMult();
  const silver  = (r.s || 0) / r.a;
  out.push({ id, depth, recipe: r, kids, mats, fee: myFee, focus: myFocus });
  return { cost: mats + myFee + silver, focus: focus + (cfg.focus ? myFocus : 0),
           fame: fame, fee: fee + myFee, buy: false };
}

function calc(){
  const rec = IX.get(sel);
  if(!rec || !rec.r) return null;
  const nodes = [];
  const u = unitCost(sel, 0, new Set(), nodes);
  const qty = cfg.qty || 1;

  const sp    = sellPrice(sel);
  const gross = sp.v * qty;
  const net   = sp.net * qty;
  const tax   = gross - net;
  const cost  = u.cost * qty;
  const profit = net - cost;

  return {
    rec, nodes, unit: u.cost, cost, qty,
    focusTotal: u.focus * qty, fameTotal: u.fame * qty, feeTotal: u.fee * qty,
    sellUnit: sp.v, sp, gross, tax, net, profit,
    margin: cost > 0 ? profit / cost : NaN,
    perFocus: u.focus > 0 ? profit / (u.focus * qty) : NaN,
    rr: returnRate(rec), b: bonusSum(rec),
  };
}

/* ══ 시세 조회 ══════════════════════════════════════════════════ */
function neededIds(){
  const s = new Set([sel]);
  const nodes = [];
  unitCost(sel, 0, new Set(), nodes);
  for(const n of nodes){ s.add(n.id); n.kids.forEach(k => s.add(k.id)); }
  return [...s];
}
/* 시세 API 는 URL 8KB(8192바이트)에서 400 을 뱉는다. id 길이가 제각각이라
   개수로 자르면 손해라, URL 길이를 재서 넣을 수 있는 만큼 담는다.
   실측으로 전 도시·전 품질 조건에서 8,169자(155개)는 통과하고 8,441자는 막힌다. */
const URL_BUDGET = 7600;
/** 같은 (아이템·도시·품질) 을 이 시간 안에 이미 받았으면 다시 받지 않는다 */
const PRICE_TTL_MS = 5 * 60 * 1000;
const priceAt = new Map();   // pkey -> 받아온 시각

function priceBatches(ids, base, qs){
  const out = [];
  let cur = [], len = base.length + qs.length;
  for(const id of ids){
    const enc = encodeURIComponent(id);
    if(cur.length && len + enc.length + 1 > URL_BUDGET){ out.push(cur); cur = []; len = base.length + qs.length; }
    cur.push(enc); len += enc.length + 1;
  }
  if(cur.length) out.push(cur);
  return out;
}

/** 시세를 URL 한도까지 묶어 받아 캐시에 넣는다. onProgress 로 진행률을 보고한다. */
async function loadPrices(ids, cities, qualities, onProgress, force){
  const base = `https://${cfg.server}.albion-online-data.com/api/v2/stats/prices/`;
  const qs   = `?locations=${cities.map(encodeURIComponent).join(',')}` +
               `&qualities=${qualities.join(',')}`;
  const now = Date.now();
  const want = force ? ids : ids.filter(id =>
    !cities.every(c => qualities.every(q => {
      const t = priceAt.get(pkey(id, c, q));
      return t && now - t < PRICE_TTL_MS;
    })));
  if(!want.length){ if(onProgress) onProgress(ids.length, ids.length); return 0; }

  const batches = priceBatches(want, base, qs);
  let got = 0, done = 0;
  for(const chunk of batches){
    const res = await fetch(base + chunk.join(',') + qs);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    for(const p of await res.json()){
      prices.set(pkey(p.item_id, p.city, p.quality), {
        s: p.sell_price_min, b: p.buy_price_max,
        sd: p.sell_price_min_date.startsWith('0001') ? null : p.sell_price_min_date,
        bd: p.buy_price_max_date .startsWith('0001') ? null : p.buy_price_max_date,
      });
      got++;
    }
    // 응답이 없던 조합도 받아온 것으로 기록해 재요청을 막는다
    const t = Date.now();
    for(const enc of chunk){
      const id = decodeURIComponent(enc);
      for(const c of cities) for(const q of qualities) priceAt.set(pkey(id, c, q), t);
    }
    done += chunk.length;
    if(onProgress) onProgress(Math.min(done, want.length), want.length);
  }
  return got;
}

async function fetchPrices(forceFetch){
  if(fetching) return;
  fetching = true;
  setStatus('시세 불러오는 중…');
  const ids    = neededIds();
  const cities = PRICE_CITIES;
  let got = 0, err = null;
  try{
    got = await loadPrices(ids, cities, [1,2,3,4,5], null, forceFetch);
    lastFetch = new Date();
    await fetchHistory(ids, cities, [...new Set([1, +cfg.quality])]);
  }catch(e){ err = e.message; }
  fetching = false;
  setStatus(err ? `시세 조회 실패: ${err}`
                : `${ids.length}종 · ${got}건 · ${lastFetch.toLocaleTimeString('ko-KR')} 갱신`);
  document.getElementById('result') ? renderResult() : render();
}
/** 7일 평균가와 일 거래량 — 현재가가 튄 값인지, 실제로 팔릴 물량인지 판단용 */
async function fetchHistory(ids, cities, qualities){
  const want = [];
  for(const id of ids)
    if(!cities.every(c => qualities.every(q => hist.has(pkey(id, c, q))))) want.push(id);
  if(!want.length) return;
  const base = `https://${cfg.server}.albion-online-data.com/api/v2/stats/history/`;
  const qs = `?locations=${cities.map(encodeURIComponent).join(',')}` +
             `&qualities=${qualities.join(',')}&time-scale=24`;
  try{
    // 시세와 같은 이유로 URL 한도까지 묶는다 (90개씩 자르면 요청이 몇 배가 된다)
    for(const part of priceBatches(want, base, qs)){
      const chunk = part.join(',');
      const res = await fetch(base + chunk + qs);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      for(const e of await res.json()){
        const all  = e.data || [];
        const rows = all.slice(-7);
        const wavg = a => {
          let s = 0, c = 0;
          for(const r of a){ s += r.avg_price * r.item_count; c += r.item_count; }
          return c ? { avg: s / c, cnt: c } : null;
        };
        const w = wavg(rows);
        // 최근 3일과 그 앞 7일을 비교해 오르는 중인지 본다.
        // 하루 평균가만 보면 거래가 한두 건인 날에 휘둘리므로 거래량 가중으로 잡는다.
        const near = wavg(all.slice(-3)), far = wavg(all.slice(-10, -3));
        const last = all.length ? all[all.length - 1].timestamp : null;
        // 28일 피크가 — 거래가 한두 건뿐인 날의 튄 값은 빼고 잡는다
        const counts = all.map(r => r.item_count).sort((a, b) => a - b);
        const med  = counts.length ? counts[counts.length >> 1] : 0;
        const solid = all.filter(r => r.item_count >= Math.max(1, med * 0.2));
        let peak = null;
        for(const r of solid) if(!peak || r.avg_price > peak.avg_price) peak = r;
        hist.set(pkey(e.item_id, e.location, e.quality), {
          avg: w ? w.avg : NaN,
          vol: rows.length ? (w ? w.cnt : 0) / rows.length : NaN,
          days: rows.length,
          trend: (near && far && far.avg) ? near.avg / far.avg - 1 : NaN,
          last,
          peak: peak ? peak.avg_price : NaN,
          peakDate: peak ? peak.timestamp : null,
          medVol: med,
          span: all.length,
        });
      }
    }
  }catch(e){ /* 추이는 보조 정보 — 실패해도 계산은 그대로 */ }
  // 응답이 없던 조합은 빈 값으로 채워 재요청을 막는다
  for(const id of want)
    for(const c of cities)
      for(const q of qualities)
        if(!hist.has(pkey(id, c, q))) hist.set(pkey(id, c, q), null);
}
const hist7 = (id, city, q = 1) => hist.get(pkey(id, city, q)) || null;

/** 하루 거래량의 일부만 걸어야 시장을 흔들지 않고 털린다 (통상 10~20%) */
function suggestQty(h){
  if(!h || !isFinite(h.vol) || h.vol <= 0) return NaN;
  return Math.max(1, Math.round(h.vol * (cfg.sellShare || 15) / 100));
}
/** 28일 최고 체결가 — 여기에 판매 주문을 걸어두고 기다리는 전략 */
function suggestPrice(h){
  return h && isFinite(h.peak) && h.peak > 0 ? h.peak : NaN;
}

/** 최근 추세를 화살표로. 데이터가 오래됐으면 신뢰도가 떨어지므로 표시해 준다. */
function trendTag(h){
  if(!h || !isFinite(h.trend)) return '';
  // 마지막 체결이 며칠 전인지 — 아시아는 3~7일씩 밀리는 아이템이 흔해서 그대로 보여준다
  const days = h.last ? Math.floor(staleH(h.last) / 24) : null;
  const old  = days !== null && days >= 3;
  const age  = old ? ` <span class="mut">${days}일 전</span>` : '';
  const t = h.trend;
  if(Math.abs(t) < 0.03)
    return `<span class="mut" style="font-size:10px">보합${age}</span>`;
  const cls = old ? 'mut' : (t > 0 ? 'up' : 'dn');
  return `<span class="${cls}" style="font-size:10px">${t > 0 ? '▲' : '▼'} ${
    t > 0 ? '+' : ''}${(t * 100).toFixed(0)}%</span>${age}`;
}

const setStatus = t => document.getElementById('status').textContent = t;

/* ══ 수익 후보 탐색 ═════════════════════════════════════════════
   지금 설정(도시·집중·판매처·품질·세금)을 그대로 적용해, 목록 조건에
   걸리는 아이템을 한꺼번에 계산하고 이익이 나는 것만 추려 보여준다. */
let dailyOpen = false, scanTodo = false;
let scanBusy = false, scanRows = null, scanInfo = '', scanHint = '';
/* 탐색 결과는 아이템 상세로 넘어가도 버리지 않고, scanOpen 으로 화면만 오간다 */
let scanOpen = false;
let scanSort = 'profit';   // profit | margin | vol | safe

/** 결과 정렬 — 거래량과 '7일 평균 대비' 는 이익률만큼이나 중요한 판단 재료다 */
function scanSorted(){
  if(!scanRows) return [];
  const h = x => hist7(x.id, x.sp.city || cfg.sellCity, x.q || 1);
  const vol = x => { const g = h(x); return g && isFinite(g.vol) ? g.vol : -1; };
  const dev = x => {
    const g = h(x);
    if(!g || !isFinite(g.avg) || !g.avg) return null;
    return x.sell / g.avg - 1;
  };
  const rows = [...scanRows];
  if(scanSort === 'margin') rows.sort((a,b) => b.margin - a.margin);
  else if(scanSort === 'focus') rows.sort((a,b) =>
    (isFinite(b.perFocus) ? b.perFocus : -Infinity) - (isFinite(a.perFocus) ? a.perFocus : -Infinity));
  else if(scanSort === 'vol') rows.sort((a,b) => vol(b) - vol(a));
  else if(scanSort === 'trend'){
    const tr = x => { const g = h(x); return g && isFinite(g.trend) ? g.trend : -Infinity; };
    rows.sort((a,b) => tr(b) - tr(a));
  }
  else if(scanSort === 'safe'){
    // 거래량이 있고 현재가가 평균에서 덜 벗어난 것부터 — 튄 주문에 속지 않도록
    const score = x => {
      const d = dev(x), v = vol(x);
      if(d === null || v < 0) return -Infinity;
      return v * 1000 - Math.abs(d) * 1e6;
    };
    rows.sort((a,b) => score(b) - score(a));
  }
  else rows.sort((a,b) => b.profit - a.profit);
  return rows;
}

/** 탐색 대상: 사이드바 필터를 그대로 쓰되, 판매처에서 거래되는 것만 남긴다 */
function scanCandidates(){
  if(todoMode)      // 오늘 보너스 걸린 카테고리만, 사이드바 필터는 티어·인챈트만 적용
    return ITEMS.filter(r => r.r && dailyLevel(r.cc)
      && (!tierF || r.t === tierF) && (enchF < 0 || (r.e || 0) === enchF)
      && (!isBM(cfg.sellCity) || BM_SELLS(r)));
  return ITEMS.filter(r => matches(r) && (!isBM(cfg.sellCity) || BM_SELLS(r)));
}

/** 후보와 그 재료들을 깊이 제한을 두고 모은다 (시세를 한 번에 받기 위해) */
function scanIds(candIds, maxDepth = 3){
  const seen = new Set(), out = new Set();
  const walk = (id, d) => {
    out.add(id);
    if(d >= maxDepth || seen.has(id)) return;
    seen.add(id);
    const r = recipeOf(id);
    if(r) for(const m of r.m) walk(m[0], d + 1);
  };
  for(const id of candIds) walk(id, 0);
  return [...out];
}

/* 오늘 일일 보너스가 걸린 카테고리만 훑는다. 보너스가 붙은 것만 보면
   '오늘 뭘 해야 하나' 가 바로 나온다 — 카테고리 수가 적어 조회도 가볍다. */
let todoMode = false;
async function runTodo(){
  if(!dailyCount()){
    dailyOpen = true;
    scanOpen = false; circuitOpen = false;
    render();
    setStatus('오늘 일일 보너스가 걸린 카테고리를 먼저 골라주세요');
    return;
  }
  todoMode = true;
  await runScan();
  todoMode = false;
}

async function runScan(){
  if(scanBusy) return;
  scanBusy = true; scanRows = null; scanOpen = true; scanHint = ''; scanTodo = todoMode;
  const cands = scanCandidates();
  scanInfo = `${fmt(cands.length)}종 계산 중…`;
  renderScan();
  try{
    const ids    = scanIds(cands.map(r => r.id));
    const cities = PRICE_CITIES;
    // 품질은 걸러내지 않고 전부 받아 결과에서 구분한다 (재료는 품질이 없어 1만 쓴다)
    const quals  = QUALITIES;
    await loadPrices(ids, cities, quals, (done, all) => {
      scanInfo = `시세 ${fmt(done)}/${fmt(all)}종 조회 중…`;
      setStatus(scanInfo);
      const el = document.getElementById('scaninfo');
      if(el) el.textContent = scanInfo;
    });

    // 어느 도시에도 현재 주문이 없는 재료는 7일 평균으로 채운다.
    // 후보(완제품)는 제외 — 팔 사람이 없는데 팔린다고 계산하면 안 된다.
    if(cfg.crossCity){
      const candSet = new Set(cands.map(r => r.id));
      const gaps = ids.filter(id => !candSet.has(id) &&
        !CITIES.some(([c]) => { const p = rawPrice(id, c, 1); return p && (p.s || p.b); }));
      if(gaps.length){
        scanInfo = `현재 주문 없는 재료 ${fmt(gaps.length)}종 추이 조회 중…`;
        setStatus(scanInfo);
        await fetchHistory(gaps, CITIES.map(c => c[0]), [1]);
      }
    }

    const rows = [];
    let noSell = 0, rescuable = 0;   // 판매 시세가 없어 빠진 수 / 설정만 바꾸면 살아나는 수
    for(const rec of cands){
      const r = recipeOf(rec.id);
      if(!r) continue;
      // 원가는 품질과 무관하다 — 재료에는 품질이 없다
      const u = unitCost(rec.id, 0, new Set(), []);
      if(!isFinite(u.cost) || u.cost <= 0) continue;
      const mult = matMult(rec);
      const mats = r.m.map(([mid, cnt, nr]) => ({
        id: mid,
        need: (cnt / r.a) * (noReturn(mid, nr) ? 1 : mult),
        unit: unitCost(mid, 1, new Set(), []).cost,
      }));
      let any = false;
      for(const q of QUALITIES){
        const sp = sellPrice(rec.id, q);
        if(!isFinite(sp.v) || !sp.v) continue;
        // 그 품질에 값이 없어 일반으로 대체된 행은 1번과 중복이라 버린다
        if(q !== 1 && !rawPriceAt(rec.id, sp.city, q)) continue;
        any = true;
        const profit = sp.net - u.cost;
        rows.push({
          id: rec.id, rec, q,
          mats, matCost: u.cost - u.fee,
          fee: u.fee, cost: u.cost, sell: sp.v, sp,
          profit, margin: profit / u.cost,
          focus: u.focus,
          perFocus: u.focus > 0 ? profit / u.focus : NaN,
        });
      }
      if(!any){
        noSell++;
        if(!isAuto() && venueOptions(rec.id, 1).length) rescuable++;
      }
    }
    rows.sort((a, b) => b.profit - a.profit);
    let pos = rows.filter(x => x.profit > 0 && x.profit >= (cfg.minProfit || 0));
    // 거래량·평균比 판정에 필요한 추이는 상위권만 받는다 (요청 2건 이내)
    const head = pos.slice(0, 150);
    if(head.length){
      // 도시별로 묶고 필요한 품질은 한 요청에 함께 보낸다 (도시×품질로 쪼개면 요청이 몇 배가 된다)
      const byCity = new Map();
      for(const x of head){
        const c = x.sp.city || cfg.sellCity;
        if(!byCity.has(c)) byCity.set(c, { ids: new Set(), qs: new Set() });
        byCity.get(c).ids.add(x.id);
        byCity.get(c).qs.add(x.q || 1);
      }
      for(const [c, v] of byCity)
        await fetchHistory([...v.ids], [c], [...v.qs]);
    }
    let cut = 0;
    const kept = head.filter(x => {
      const h = hist7(x.id, x.sp.city || cfg.sellCity, x.q || 1);
      if(cfg.minVol > 0 && (!h || !isFinite(h.vol) || h.vol < cfg.minVol)){ cut++; return false; }
      if(cfg.maxDev > 0){
        if(!h || !isFinite(h.avg) || !h.avg){ cut++; return false; }
        if(Math.abs(x.sell / h.avg - 1) * 100 > cfg.maxDev){ cut++; return false; }
      }
      return true;
    });
    const win = kept.slice(0, 60);
    scanRows = win;
    const shown = new Set(win.map(x => x.id)).size;
    scanInfo = `후보 ${fmt(cands.length)}종 → ${fmt(shown)}종 ${fmt(win.length)}행` +
               ` · 적자 ${fmt(rows.length - pos.length)}행` +
               (cut ? ` · 임계값 미달 ${fmt(cut)}행` : '') +
               ` · 시세 없음 ${fmt(noSell)}종 제외`;
    // 판매처·판매방식 때문에 대량으로 빠졌으면 어떻게 살리는지 알려준다
    scanHint = rescuable >= 5
      ? `판매 시세가 없어 빠진 ${fmt(noSell)}종 중 <b>${fmt(rescuable)}종</b>은 다른 판매처나 판매 방식에서는 값이 있습니다.` +
        (isBM(cfg.sellCity) && cfg.sellMode === 'order'
          ? ` 암시장은 판매 주문이 거의 없습니다 — <b>즉시 판매</b>로 바꾸거나`
          : ` 판매 도시를`) +
        ` <b>자동 — 최고 실수령</b>으로 두면 잡힙니다.`
      : '';
  }catch(e){
    scanInfo = `탐색 실패: ${e.message}`; scanHint = '';
  }
  scanBusy = false;
  setStatus(scanInfo);
  renderScan();
}

/* ══ 정제 순회 ══════════════════════════════════════════════════
   왕국 도시 다섯 곳은 각각 하나의 정제 특화(+40%)를 갖는다. 그래서 정제는
   '어디서 만들까' 가 아니라 '이 도시에서 뭘 만들까' 의 문제가 된다.
   도시를 돌면서 각 도시의 특화 자원을 정제하는 한 바퀴를 계산한다. */
const CIRCUIT = [
  ['Fort Sterling', 'wood',  '판자'],
  ['Thetford',      'ore',   '주괴'],
  ['Martlock',      'hide',  '가죽'],
  ['Lymhurst',      'fiber', '직물'],
  ['Bridgewatch',   'rock',  '석괴'],
];
let circuitOpen = false, circuitRows = null, circuitInfo = '', circuitBusy = false;

/* 아티팩트가 들어가는 아이템은 값은 커도 거래가 거의 없다. 카테고리 대표를
   뽑을 때는 아티팩트 없는 기본 아이템을 먼저 본다 — 그쪽이 물량이 돈다. */
function usesArtefact(id){
  const r = recipeOf(id);
  return !!r && r.m.some(m => m[0].includes('ARTEFACT'));
}

/** 그 도시에서 팔 때 실수령이 가장 큰 (판매 주문 / 즉시 판매) */
function bestNetAt(id, city, q = 1){
  const p = rawPrice(id, city, q) || (q !== 1 ? rawPrice(id, city, 1) : null);
  if(!p) return null;
  const opts = [];
  if(p.s) opts.push({ city, mode:'order',   v:p.s, net:netOf(p.s,'order'),   date:p.sd });
  if(p.b) opts.push({ city, mode:'instant', v:p.b, net:netOf(p.b,'instant'), date:p.bd });
  return opts.length ? opts.reduce((a, b) => b.net > a.net ? b : a) : null;
}

/* 정제 특화 도시는 '생산지' 라 그 재료가 싸다. 반대로 그 재료를 쓰는 제작 특화를
   가진 도시는 '수요지' 다 — 정제품은 거기 가져가 파는 게 맞다.
   어느 도시가 무엇을 얼마나 소모하는지는 하드코딩하지 않고 레시피에서 뽑는다. */
const KIND_KO = { wood:'판자', ore:'주괴', hide:'가죽', fiber:'직물', rock:'석괴' };
const refinedKind = id => {
  const r = IX.get(id);
  return r && r.s1 === 'refinedresources' ? r.cc : null;
};
let _demand = null;
/** { 도시: { 정제계열: 비중 } } — 제작 특화 레시피가 소모하는 정제 재료 */
function craftDemand(){
  if(_demand) return _demand;
  const acc = {};
  for(const r of ITEMS){
    const city = CRAFT_CITY[r.cc];
    if(!city || !r.r || r.e) continue;      // 인챈트 변형은 중복이라 .0 만 센다
    const rec = r.r[0];
    for(const m of rec.m){
      const k = refinedKind(m[0]);
      if(!k) continue;
      (acc[city] = acc[city] || {});
      acc[city][k] = (acc[city][k] || 0) + m[1] / rec.a;
    }
  }
  for(const city in acc){
    const tot = Object.values(acc[city]).reduce((a, b) => a + b, 0) || 1;
    for(const k in acc[city]) acc[city][k] /= tot;
  }
  _demand = acc;
  return acc;
}
/* 일일 보너스가 걸릴 수 있는 생산 카테고리 — 정제 5계열 + 제작 특화 + 요리·연금 */
const DAILY_GROUPS = [
  ['정제', ['wood', 'ore', 'hide', 'fiber', 'rock']],
  ['무기', ['sword','axe','mace','hammer','spear','dagger','quarterstaff','knuckles',
            'bow','crossbow','firestaff','froststaff','arcanestaff','holystaff',
            'naturestaff','cursestaff','shapeshifterstaff','offhand']],
  ['방어구', ['plate_armor','plate_helmet','plate_shoes','leather_armor','leather_helmet',
              'leather_shoes','cloth_armor','cloth_helmet','cloth_shoes']],
  ['기타', ['bag','cape','food','potion','tools','gatherergear']],
];

/* 제작 특화 카테고리의 한글 이름 — 요약에 쓴다 */
const CAT_KO = {
  sword:'한손검·양손검', axe:'도끼', mace:'메이스', hammer:'해머', spear:'창',
  dagger:'단검', quarterstaff:'쿼터스태프', knuckles:'너클', bow:'활', crossbow:'석궁',
  firestaff:'화염 스태프', froststaff:'냉기 스태프', arcanestaff:'아케인 스태프',
  holystaff:'신성 스태프', naturestaff:'자연 스태프', cursestaff:'저주 스태프',
  shapeshifterstaff:'셰이프시프터', offhand:'보조 장비',
  plate_armor:'판금 갑옷', plate_helmet:'판금 투구', plate_shoes:'판금 신발',
  leather_armor:'가죽 갑옷', leather_helmet:'가죽 투구', leather_shoes:'가죽 신발',
  cloth_armor:'천 갑옷', cloth_helmet:'천 투구', cloth_shoes:'천 신발',
  bag:'가방', cape:'망토', food:'음식', potion:'물약',
  tools:'채집 도구', gatherergear:'채집 장비',
  wood:'판자(목재)', ore:'주괴(광석)', hide:'가죽(피혁)',
  fiber:'직물(섬유)', rock:'석괴(석재)',
};
const dailyLevel = cc => (cfg.dailyCats || {})[cc] || 0;
const dailyCount = () => Object.keys(cfg.dailyCats || {}).length;

/** 그 정제 계열을 가장 많이 쓰는 도시 순서 */
function demandCities(kind){
  const d = craftDemand();
  return Object.entries(d)
    .filter(([, v]) => v[kind])
    .map(([city, v]) => ({ city, share: v[kind] }))
    .sort((a, b) => b.share - a.share);
}

/** 같은 자원 계열의 한 단계 아래 정제품 (T6 판자 → T5 판자) */
function lowerRefined(id){
  const rec = IX.get(id), r = recipeOf(id);
  if(!rec || !r) return null;
  for(const m of r.m){
    const sub = IX.get(m[0]);
    if(sub && sub.cc === rec.cc && sub.s1 === 'refinedresources') return m[0];
  }
  return null;
}
/** 깊이 d 만큼 하위 정제품을 직접 정제하도록 모은다 */
function chainIds(id, d){
  const out = [];
  let cur = id;
  for(let i = 0; i < d; i++){
    const low = lowerRefined(cur);
    if(!low) break;
    out.push(low);
    cur = low;
  }
  return out;
}
/** 정제 특화 도시 기준으로, 지정한 체인 깊이의 원가를 낸다 */
function refineCost(id, depth){
  const keepStation = cfg.station, keepSet = [...craftSet];
  cfg.station = 'bonus';                       // 특화 도시에서 정제한다는 전제
  craftSet.clear();
  for(const x of chainIds(id, depth)) craftSet.add(x);
  const u = unitCost(id, 0, new Set(), []);
  cfg.station = keepStation;
  craftSet.clear();
  for(const x of keepSet) craftSet.add(x);
  return u;
}
/** 체인 깊이를 0..max 까지 훑어 가장 싼 것을 고른다 */
function bestRefine(id){
  const max = chainIds(id, 9).length;
  let best = null;
  for(let d = 0; d <= max; d++){
    const u = refineCost(id, d);
    if(!isFinite(u.cost) || u.cost <= 0) continue;
    if(!best || u.cost < best.u.cost) best = { d, u };
  }
  return best;
}

async function runCircuit(){
  if(circuitBusy) return;
  circuitBusy = true; circuitRows = null; circuitOpen = true; scanOpen = false;
  circuitInfo = '정제 대상 계산 중…';
  renderCircuit();
  try{
    const filt = r => (!tierF || r.t === tierF) && (enchF < 0 || (r.e || 0) === enchF);
    const cands = ITEMS.filter(r => r.r && CIRCUIT.some(c => c[1] === r.cc) && filt(r));
    const ids = scanIds(cands.map(r => r.id), 8);
    await loadPrices(ids, PRICE_CITIES, [1], (done, all) => {
      circuitInfo = `시세 ${fmt(done)}/${fmt(all)}종 조회 중…`;
      setStatus(circuitInfo);
      const el = document.getElementById('circuitinfo');
      if(el) el.textContent = circuitInfo;
    });

    const rows = [];
    for(const rec of cands){
      const pick = cfg.chainDepth === 'best'
        ? bestRefine(rec.id)
        : (() => { const u = refineCost(rec.id, +cfg.chainDepth || 0);
                   return isFinite(u.cost) && u.cost > 0 ? { d: +cfg.chainDepth || 0, u } : null; })();
      if(!pick) continue;
      const sp = sellPrice(rec.id, 1);
      if(!isFinite(sp.v) || !sp.v) continue;
      const profit = sp.net - pick.u.cost;
      rows.push({
        id: rec.id, rec, city: REFINE_CITY[rec.cc], depth: pick.d,
        maxDepth: chainIds(rec.id, 9).length,
        cost: pick.u.cost, fee: pick.u.fee, focus: pick.u.focus,
        sell: sp.v, sp, profit, margin: profit / pick.u.cost,
      });
    }
    rows.sort((a, b) => b.profit - a.profit);
    const win = rows.filter(x => x.profit > 0);
    if(win.length){
      const byCity = new Map();
      for(const x of win.slice(0, 120)){
        const c = x.sp.city || cfg.sellCity;
        if(!byCity.has(c)) byCity.set(c, []);
        byCity.get(c).push(x.id);
      }
      for(const [c, list] of byCity) await fetchHistory(list, [c], [1]);
    }
    circuitRows = win;
    circuitInfo = `정제품 ${fmt(cands.length)}종 중 이익 나는 ${fmt(win.length)}종` +
                  ` · 적자 ${fmt(rows.length - win.length)}종` +
                  ` · 시세 없음 ${fmt(cands.length - rows.length)}종 제외`;
  }catch(e){
    circuitInfo = `계산 실패: ${e.message}`;
  }
  circuitBusy = false;
  setStatus(circuitInfo);
  renderCircuit();
}

/* 검색 대상 문자열 — 처음 쓸 때 한 번 만들어 레코드에 붙여 둔다 */
function searchText(r){
  return r._s || (r._s = [r.ko, r.en, r.id, r.cc, r.s1, r.s2, CAT_ALIAS[r.cc]]
    .filter(Boolean).join(' ').toLowerCase());
}

function matches(r){
  if(!r.r) return false;
  // 검색어가 있으면 카테고리 탭 제한을 풀어 전체에서 찾는다
  if(!query){
    const t = TABS.find(t => t[0] === tab);
    if(t && !t[2](r)) return false;
  }
  if(tierF && r.t !== tierF) return false;
  if(enchF >= 0 && (r.e || 0) !== enchF) return false;
  if(query && !searchText(r).includes(query.toLowerCase())) return false;
  return true;
}
function renderSidebar(){
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button data-tab="${t[0]}" class="${!query && t[0] === tab ? 'on' : ''}">${t[1]}</button>`).join('')
    + (query ? `<div class="more" style="flex-basis:100%;padding:4px">검색 중 — 전체 카테고리에서 찾습니다</div>` : '');
  document.getElementById('tierf').innerHTML =
    ['전체',4,5,6,7,8].map((t,i) => {
      const v = i === 0 ? 0 : t;
      return `<button class="pill ${tierF===v?'on':''}" data-tier="${v}">${i?'T'+t:'티어 전체'}</button>`;
    }).join('');
  document.getElementById('enchf').innerHTML =
    ['인챈트 전체','.0','.1','.2','.3','.4'].map((t,i) => {
      const v = i === 0 ? -1 : i - 1;
      return `<button class="pill ${enchF===v?'on':''}" data-ench="${v}">${t}</button>`;
    }).join('');

  const hits = ITEMS.filter(matches);
  const show = hits.slice(0, LIST_MAX);
  const listEl = document.getElementById('list');
  const keepTop = listEl.scrollTop;
  listEl.innerHTML = show.map(r => `
    <div class="row ${r.id===sel?'on':''}" data-id="${esc(r.id)}">
      <img data-ico="${esc(r.id)}" alt="">
      <div class="nm">${esc(nameOf(r.id))}
        <div class="sub">${esc(r.en || '')}</div></div>
      <span class="tier">${tierLabel(r)}</span>
    </div>`).join('') +
    (hits.length > show.length
      ? `<div class="more">${fmt(hits.length - show.length)}종 더 있음 — 검색으로 좁혀보세요</div>`
      : hits.length ? '' : `<div class="more">일치하는 제작 아이템이 없습니다</div>`);
  listEl.scrollTop = keepTop;
  hydrateIcons(listEl);
}

/* ══ 재료 트리 ══════════════════════════════════════════════════ */
/* 지금 고른 레시피가 어떤 종류인지: 인챈트(룬/영혼/유물 업그레이드) · 분해 · 직접 제작 */
function craftKind(id){
  const r = recipeOf(id);
  if(!r) return null;
  if(r.up) return 'ench';
  if(convertsDown(id, r)) return 'convert';
  // 게임이 알려주는 행동 종류 (transmute=변환, refine=정제, combine=조합, ritual=의식).
  // 자원의 .0 -> .1 -> .2 는 전부 transmute 라, 인챈트 단계가 어디서 오르는지 여기서 드러난다.
  if(r.b === 'transmute') return 'transmute';
  if(r.b === 'combine')   return 'combine';
  if(r.b === 'ritual')    return 'ritual';
  return 'craft';
}
const CRAFT_KIND_LABEL = { ench:'인챈트', convert:'분해', transmute:'변환',
                           combine:'조합', ritual:'의식', craft:'직접제작' };
const CRAFT_KIND_BTN   = { ench:'인챈트', convert:'분해', transmute:'변환',
                           combine:'조합', ritual:'의식', craft:'제작' };

function treeRows(id, depth, qtyPer, seen, rows){
  const craft = useCraft(id, depth) && !seen.has(id);
  const rec = IX.get(id);
  if(craft){
    const r = recipeOf(id);
    const mult = matMult(rec);
    seen.add(id);
    for(const [mid, cnt, nr] of r.m){
      const per  = (cnt / r.a) * qtyPer;
      const need = per * (noReturn(mid, nr) ? 1 : mult);
      const sub  = useCraft(mid, depth + 1) && !seen.has(mid);
      rows.push({ id: mid, depth, per, need, craftable: canCraft(mid), crafting: sub,
                  auto: sub && autoCraft(mid, depth + 1),
                  noret: noReturn(mid, nr), kind: craftKind(mid) });
      if(sub) treeRows(mid, depth + 1, need, seen, rows);
    }
    seen.delete(id);
  }
  return rows;
}

function priceCell(id, crafting, unitCostVal, auto){
  if(crafting){
    const k = craftKind(id), r = recipeOf(id);
    if(auto) return `<span class="mut">${fmt(unitCostVal)}</span> <span class="tag craft">${
      CRAFT_KIND_LABEL[k] || '직접제작'}</span> <span class="tag stale">시세 없어 제작</span>`;
    // 변환은 재료값보다 은화 수수료가 본체라 금액을 같이 적어 준다
    const silver = k === 'transmute' && r && r.s ? ` <span class="tag">은화 ${fmt(r.s / r.a)}</span>` : '';
    return `<span class="mut">${fmt(unitCostVal)}</span> <span class="tag craft">${
      CRAFT_KIND_LABEL[k] || '직접제작'}</span>${silver}`;
  }
  const bp = buyPrice(id);
  if(bp.src === 'manual')
    return `${fmt(bp.v)} <span class="tag">수동</span>`;
  if(!isFinite(bp.v) || !bp.v)
    return `<span class="stale">시세 없음</span>`;
  if(bp.hist)
    return `${fmt(bp.v)} <span class="tag alt">7일 평균</span>${
      bp.city !== cfg.buyCity ? ` <span class="tag alt">${esc(CITY_KO[bp.city])}</span>` : ''}`;
  const cityTag = bp.alt ? ` <span class="tag alt">${esc(CITY_KO[bp.city])}</span>` : '';
  const h = staleH(bp.date);
  const hi = hist7(id, cfg.buyCity, 1);
  let dev = '';
  if(hi && isFinite(hi.avg) && hi.avg > 0){
    const d = bp.v / hi.avg - 1;
    if(Math.abs(d) >= 0.3)
      dev = ` <span class="tag stale">평균比 ${d > 0 ? '+' : ''}${(d*100).toFixed(0)}%</span>`;
  }
  return `${fmt(bp.v)}${cityTag}${
    h > 24 ? ` <span class="tag stale">${ago(bp.date)}</span>` : ''}${dev}`;
}

    ${[['profit','이익순'],['margin','이익률순'],['focus','집중당 이익순'],
       ['vol','거래량순'],['trend','상승세순'],['safe','안정성순']]
      .map(([v,k]) => `<button class="mini ${scanSort===v?'on':''}" data-sort="${v}">${k}</button>`).join('')}
  </div>` : ''}`;

  if(scanBusy || !scanRows){
    main.innerHTML = head +
      `<div class="empty">${scanBusy ? '계산 중입니다…'
        : '왼쪽 목록 조건(카테고리·티어·인챈트·검색)에 걸리는 아이템을 모두 계산합니다.'}</div>`;
    hydrateIcons(main); return;
  }
  if(!scanRows.length){
    main.innerHTML = head + `<div class="empty">이익이 나는 후보가 없습니다.<br>
      <span class="mut">티어·인챈트를 바꾸거나 판매 도시·판매 방식을 조정해 보세요.</span></div>`;
    hydrateIcons(main); return;
  }

  main.innerHTML = head + `
  <div style="overflow-x:auto">
  <table>
    <thead><tr>
      <th>아이템</th><th>품질</th><th>재료 (1개당 실소모)</th><th>재료비</th><th>수수료</th>
      <th>개당 원가</th><th>판매처</th><th>판매가</th><th>7일 평균</th><th>최근 추세</th>
      <th>개당 이익</th><th>이익률</th>${cfg.focus ? '<th>집중당</th>' : ''}
      <th>일 거래량</th><th>권장 수량</th><th>28일 피크가</th>
    </tr></thead>
    <tbody>
    ${scanSorted().map(x => {
      const h = hist7(x.id, x.sp.city || cfg.sellCity, x.q || 1);
      const thin = !h || !isFinite(h.vol) || h.vol < 20;
      const dev = h && isFinite(h.avg) && h.avg ? x.sell / h.avg - 1 : null;
      const spike = dev !== null && Math.abs(dev) >= 0.3;
      return `<tr data-pick="${esc(x.id)}" data-q="${x.q}" style="cursor:pointer">
        <td><div class="mat">
          <img data-ico="${esc(x.id)}" alt="">
          <div class="tw"><div class="nm">${esc(nameOf(x.id))}</div>
            <div class="id">${tierLabel(x.rec)} · ${esc(x.id)}</div></div>
        </div></td>
        <td>${x.q > 1 ? `<span class="tag q${x.q}">${QUALITY_KO[x.q]}</span>`
                      : `<span class="mut">일반</span>`}</td>
        <td style="text-align:left">${x.mats.map(m => `
          <div class="mat" style="gap:5px;margin:1px 0">
            <img data-ico="${esc(m.id)}" alt="" style="width:20px;height:20px">
            <span class="mut" style="font-size:11px">${fmtQ(m.need)} ×
              ${isFinite(m.unit) ? fmt(m.unit) : '—'}</span>
          </div>`).join('')}</td>
        <td>${fmt(x.matCost)}</td>
        <td>${fmt(x.fee)}</td>
        <td>${fmt(x.cost)}</td>
        <td style="text-align:left"><span class="${x.sp.auto || x.sp.alt ? 'alt2' : ''}">${
              esc(CITY_KO[x.sp.city] || '—')}</span>
          <div class="mut" style="font-size:10px">${
              x.sp.mode === 'order' ? '판매 주문' : '즉시 판매'}</div></td>
        <td>${fmt(x.sell)}${x.sp.date && staleH(x.sp.date) > 24
              ? `<div class="mut" style="font-size:10px">${ago(x.sp.date)}</div>` : ''}</td>
        <td>${dev === null ? '<span class="stale">기록 없음</span>'
              : `${fmt(h.avg)}<div class="${spike ? 'stale' : 'mut'}" style="font-size:10px">${
                  dev > 0 ? '+' : ''}${(dev*100).toFixed(0)}%</div>`}</td>
        <td>${trendTag(h) || '<span class="mut">—</span>'}</td>
        <td class="up">+${fmt(x.profit)}</td>
        <td class="up">${pct(x.margin)}</td>
        ${cfg.focus ? `<td class="${isFinite(x.perFocus) ? 'up' : 'mut'}">${
            isFinite(x.perFocus) ? fmt1(x.perFocus) : '—'}</td>` : ''}
        <td class="${thin ? 'stale' : 'mut'}">${h && isFinite(h.vol) ? fmt(h.vol) : '—'}</td>
        ${(() => {
          const q = suggestQty(h), pk = suggestPrice(h);
          const qCell = isFinite(q)
            ? `<td><b>${fmt(q)}</b>개<div class="mut" style="font-size:10px">일 ${
                fmt(h.vol)}의 ${cfg.sellShare}%</div></td>`
            : `<td class="mut">—</td>`;
          if(!isFinite(pk)) return qCell + `<td class="mut">—</td>`;
          const pm = (netOf(pk, 'order') - x.cost) / x.cost;   // 피크가에 판매 주문을 건다면
          return qCell + `<td>${fmt(pk)}<div class="${pm > 0 ? 'up' : 'dn'}" style="font-size:10px">${
            pm > 0 ? '이익률 ' + pct(pm) : '피크에도 적자'}</div></td>`;
        })()}
      </tr>`;
    }).join('')}
    </tbody>
  </table>
  </div>
  <div class="note">
    현재 설정(${CITY_KO[cfg.buyCity]}에서 재료 구매 · ${
      isAuto() ? '판매처 자동 선택' : CITY_KO[cfg.sellCity] + '에 ' +
        (cfg.sellMode === 'order' ? '판매 주문' : '즉시 판매')} · 
    ${cfg.station === 'bonus' ? '보너스 도시' : cfg.station === 'island' ? '섬'
      : cfg.station === 'hideout' ? '은신처' : '일반 도시'}${cfg.focus ? ' · 집중 사용' : ''})
    기준입니다. 행을 누르면 그 아이템의 상세 계산으로 넘어갑니다.<br>
    <b>7일 평균 대비</b>가 크게 벌어져 있으면 지금 값이 튄 주문일 가능성이 높습니다.
    이익률이 아무리 높아도 그 주문 하나가 사라지면 그만입니다.
    <b>일 거래량</b>이 낮으면(20 미만, 색으로 표시) 만들어도 안 팔립니다.
    <b>최근 추세</b>는 최근 3일 체결가를 그 앞 7일과 견준 값입니다(거래량 가중).
    <span class="up">▲</span> 면 오르는 중이라 지금 만들 만하고,
    <span class="dn">▼</span> 면 완성될 즈음 더 떨어져 있을 수 있습니다.
    마지막 체결이 3일 이상 지났으면 며칠 전인지 함께 표시하고 색을 죽입니다.<br>
    <b>품질</b>은 걸러내지 않고 시세가 있는 품질을 모두 따로 계산해 보여줍니다 —
    같은 아이템이 품질별로 여러 줄 나올 수 있습니다. 원가는 품질과 무관하고
    (재료에는 품질이 없습니다) 판매가·거래량·피크가만 갈립니다.
    행을 누르면 그 품질로 상세 계산에 들어갑니다.
    위 '제작 조건' 의 완제품 품질은 상세 계산에만 적용됩니다.<br>
    <b>권장 수량</b>은 하루 거래량의 ${cfg.sellShare}% 입니다. 하루 100개 팔리는 아이템에
    100개를 한 번에 걸면 시장을 눌러버려 악성 재고가 됩니다. 통상 10~20% 선을 지킵니다.<br>
    <b>28일 피크가</b>는 최근 4주 중 가장 높게 체결된 날의 가격입니다(거래가 한두 건뿐인 날은 제외).
    급하게 구매 주문에 넘기는 대신 이 부근에 판매 주문을 걸어두면, 주말 프라임타임처럼
    수요가 몰릴 때 한 번에 쓸려갑니다. 옆에 그 가격으로 팔았을 때의 이익률을 같이 적었습니다.<br>
    <b>안정성순</b>은 거래량이 있으면서 평균에서 덜 벗어난 것부터 보여줍니다.
    <b>집중당 이익순</b>은 집중을 쓸 때만 나오며, 하루 10,000 집중을 어디에
    쓸지 고르는 기준입니다 — 이익률이 높아도 집중을 많이 먹으면 손해입니다.<br>
    <b>판매처</b>가 파란색이면 자동 선택되거나 대체된 곳입니다. 세금·등록비를 뺀
    실수령이 가장 큰 (도시 × 판매방식) 조합을 고릅니다.<br>
    재료는 시세가 있으면 사서 쓰고, 시세가 없는데 만들 수 있으면 제작 원가로 계산합니다.
  </div>`;
  hydrateIcons(main);
}

/* ══ 정제 순회 화면 ═════════════════════════════════════════════ */
function renderCircuit(){
  const main = document.getElementById('main');
  const rec0 = IX.get(sel);
  const depths = [['0','하위 정제품 구매'],['1','1단계'],['2','2단계'],['3','3단계'],['best','최적(자동)']];
  const head = `
  ${cfgPanel(rec0 && rec0.r ? rec0 : { cc: '', sc: '' })}
  <div class="head" style="gap:10px">
    <div style="flex:1;min-width:0">
      <h2 style="font-size:16px">정제 순회</h2>
      <div class="en" id="circuitinfo">${esc(circuitInfo || '')}</div>
    </div>
    <button class="btn" data-circuitback="1">아이템 계산으로</button>
    <button class="btn pri" data-circuitrun="1" ${circuitBusy ? 'disabled' : ''}>다시 계산</button>
  </div>
  <div class="cfg" style="padding:9px 12px;margin-bottom:10px">
    <h3 style="margin-bottom:7px">체인 깊이</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${depths.map(([v,k]) => `<button class="mini ${String(cfg.chainDepth)===v?'on':''}"
        data-chain="${v}">${k}</button>`).join('')}
      <span class="status" style="margin-left:6px">하위 정제품을 사서 한 단계만 정제할지,
        아래로 몇 단계까지 직접 정제할지 고릅니다. <b>최적</b>은 행마다 가장 싼 깊이를 골라
        몇 단계인지 표시합니다.</span>
    </div>
  </div>`;

  if(circuitBusy || !circuitRows){
    main.innerHTML = head + `<div class="empty">${circuitBusy ? '계산 중입니다…'
      : '왕국 도시 다섯 곳의 정제 특화(+40%)를 기준으로 한 바퀴를 계산합니다.<br>' +
        '<span class="mut">왼쪽의 티어·인챈트 필터가 적용됩니다.</span>'}</div>`;
    hydrateIcons(main); return;
  }

  const groups = CIRCUIT.map(([city, cc, label]) => ({
    city, cc, label,
    rows: circuitRows.filter(x => x.rec.cc === cc).slice(0, 8),
  }));
  const lap = groups.reduce((a, g) => a + (g.rows[0] ? g.rows[0].profit : 0), 0);

  main.innerHTML = head + `
  <div class="cards">
    <div class="card big"><div class="k">한 바퀴 개당 이익 합</div>
      <div class="v ${lap > 0 ? 'up' : ''}">${fmt(lap)}</div>
      <div class="n">도시마다 가장 좋은 것 하나씩, 개당 기준</div></div>
    <div class="card"><div class="k">이익 나는 정제품</div>
      <div class="v">${fmt(circuitRows.length)}</div>
      <div class="n">전체 ${fmt(CIRCUIT.length)}개 도시</div></div>
  </div>
  ${groups.map(g => `
    <div class="sec">${esc(CITY_KO[g.city])} — ${esc(g.label)} 특화 <span class="mut"
      style="font-weight:400;letter-spacing:0">정제 반환 +40%</span></div>
    ${(() => {
      const d = craftDemand()[g.city];
      if(!d) return `<div class="status" style="margin-bottom:6px">이 도시의 제작 특화는
        정제 재료를 쓰지 않습니다</div>`;
      const list = Object.entries(d).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `${KIND_KO[k]} ${(v * 100).toFixed(0)}%`).join(' · ');
      return `<div class="status" style="margin-bottom:6px">이 도시 제작자들이 사가는 재료:
        <b>${list}</b> — 여기서 ${esc(g.label)}를 정제하는 김에 이 재료들을 팔면 됩니다</div>`;
    })()}
    ${g.rows.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>정제품</th><th>체인</th><th>개당 원가</th><th>수수료</th>
        <th>판매처</th><th>판매가</th><th>제작 수요지</th><th>개당 이익</th><th>이익률</th>
        <th>일 거래량</th><th>권장 수량</th></tr></thead>
      <tbody>${g.rows.map((x, i) => {
        const h = hist7(x.id, x.sp.city || cfg.sellCity, 1);
        const q = suggestQty(h);
        return `<tr data-pick="${esc(x.id)}" data-q="1" style="cursor:pointer${
          i === 0 ? ';background:#1e2a20' : ''}">
          <td><div class="mat"><img data-ico="${esc(x.id)}" alt="">
            <div class="tw"><div class="nm">${esc(nameOf(x.id))}</div>
            <div class="id">${tierLabel(x.rec)} · ${esc(x.id)}</div></div></div></td>
          <td>${x.depth === 0 ? '<span class="mut">구매</span>'
                : `${x.depth}단계`}${x.maxDepth > x.depth
                ? `<div class="mut" style="font-size:10px">최대 ${x.maxDepth}</div>` : ''}</td>
          <td>${fmt(x.cost)}</td>
          <td>${fmt(x.fee)}</td>
          <td style="text-align:left"><span class="${x.sp.auto || x.sp.alt ? 'alt2' : ''}">${
            esc(CITY_KO[x.sp.city] || '—')}</span>
            <div class="mut" style="font-size:10px">${
              x.sp.mode === 'order' ? '판매 주문' : '즉시 판매'}</div></td>
          <td>${fmt(x.sell)}${trendTag(h) ? `<div>${trendTag(h)}</div>` : ''}</td>
          <td style="text-align:left">${(() => {
            const dc = demandCities(x.rec.cc);
            if(!dc.length) return `<span class="mut">제작 수요 없음</span>`;
            const top = dc[0];
            const hit = x.sp.city === top.city;
            // 수요 1위 도시에서 팔면 얼마인지 같이 보여줘 비교되게 한다
            const p = rawPrice(x.id, top.city, 1);
            const there = p && p.s ? netOf(p.s, 'order') : (p && p.b ? netOf(p.b, 'instant') : NaN);
            return `<span class="${hit ? 'up' : 'alt2'}">${esc(CITY_KO[top.city])}</span>
              <span class="mut" style="font-size:10px">${(top.share * 100).toFixed(0)}%</span>
              <div class="${hit ? 'up' : 'mut'}" style="font-size:10px">${
                hit ? '판매처와 일치'
                    : isFinite(there) ? `여기선 실수령 ${fmt(there)}` : '그쪽 시세 없음'}</div>`;
          })()}</td>
          <td class="up">+${fmt(x.profit)}</td>
          <td class="up">${pct(x.margin)}</td>
          <td class="${!h || !isFinite(h.vol) || h.vol < 20 ? 'stale' : 'mut'}">${
            h && isFinite(h.vol) ? fmt(h.vol) : '—'}</td>
          <td>${isFinite(q) ? `<b>${fmt(q)}</b>개` : '<span class="mut">—</span>'}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`
    : `<div class="empty" style="padding:22px">이익 나는 정제품이 없습니다</div>`}
  `).join('')}
  <div class="note">
    도시마다 정제 특화가 달라 <b>그 도시에서는 그 자원만</b> +40% 반환을 받습니다.
    각 도시의 첫 줄(초록 배경)이 그 도시에서 가장 이익이 큰 정제품입니다.<br>
    <b>제작 수요지</b> · 정제 특화 도시는 생산지라 그 재료가 흔하고 쌉니다. 반대로 그 재료를
    쓰는 제작 특화를 가진 도시는 수요지입니다 — 정제품은 그쪽에 가져가 파는 게 맞습니다.
    어느 도시가 무엇을 쓰는지는 실제 레시피에서 뽑았습니다
    (판자→림허스트, 주괴→브릿지워치, 가죽→림허스트, 직물→포트 스털링).
    <span class="up">초록</span>이면 판매처가 이미 수요 1위 도시와 같고,
    <span class="alt2">파랑</span>이면 그쪽에서 팔면 실수령이 얼마인지 옆에 적었습니다.
    <b>석괴는 장비 제작에 쓰이지 않아 제작 수요가 없습니다</b> — 건물·가구용입니다.<br>
    <b>여기서 이어서 제작하기</b> · 그 도시 제작 특화(+15%) 카테고리마다 대표 아이템 하나를
    골라(아티팩트가 들어가는 것은 값은 커도 거래가 거의 없어 기본 아이템을 먼저 고릅니다), <b>그 도시에서 바로 파는 경우</b>와
    <b>암시장까지 가는 경우</b>를 나란히 놓았습니다. 이익만 보지 않고 일 거래량도 함께 비교해
    '더 나은 쪽' 을 판정합니다 — 이익이 높아도 물량이 안 받쳐주면 그 점을 적어 둡니다.
    줄 순서도 일 거래량 20 이상인 것을 위로 올립니다.
    재료비는 시장 시세 기준이라, 직접 정제해 왔다면 실제 원가는 이보다 낮습니다.<br>
    <b>체인</b> 열의 '구매' 는 하위 정제품을 시장에서 사서 한 단계만 정제한 것이고,
    'N단계' 는 아래로 N번 더 직접 정제한 것입니다. 깊게 갈수록 원가는 내려가지만
    자본과 시간이 더 들고, 중간 자원 시세가 비면 계산이 흔들립니다.<br>
    원가는 정제 특화 도시에서 만든다는 전제로 계산합니다 —
    위 '제작 조건' 의 제작 장소 설정과 무관하게 항상 +40% 를 적용합니다.
    재료 구매 도시와 판매처 설정은 그대로 반영됩니다.
  </div>`;
  hydrateIcons(main);
}

/* ══ 여정 계획 ══════════════════════════════════════════════════
   계산은 이미 '각 단계를 그 단계의 특화 도시에서 한다' 는 전제로 돌아간다
   (정제는 +40%, 제작은 +15%). 그런데 어디로 가서 무엇을 하는지가 화면에
   안 보였다. 재료 트리를 도시 단위로 다시 묶어 한 바퀴로 펼친다. */
function journeyStops(){
  const rec = IX.get(sel);
  if(!rec || !rec.r) return null;
  const nodes = [];
  const u = unitCost(sel, 0, new Set(), nodes);
  if(!isFinite(u.cost)) return null;
  const qty = cfg.qty || 1;

  // 완제품 1개당 필요량을 노드별로 모은다
  const need = new Map([[sel, 1]]);
  for(const n of nodes.slice().reverse()){
    const have = need.get(n.id) || 0;
    for(const k of n.kids) need.set(k.id, (need.get(k.id) || 0) + k.need * have);
  }
  const crafted = new Set(nodes.map(n => n.id));

  /** 그 아이템을 어느 도시에서 만드는가 */
  const madeIn = id => {
    const r = IX.get(id);
    if(!r) return null;
    return REFINE_CITY[r.cc] || CRAFT_CITY[r.cc] || null;
  };

  const stops = [];
  const addStop = (city, kind) => {
    let st = stops.find(s => s.city === city && s.kind === kind);
    if(!st){ st = { city, kind, make: [], buy: [] }; stops.push(st); }
    return st;
  };

  // 정제·제작 단계를 티어 낮은 것부터 (체인은 아래에서 위로 올라간다)
  const madeNodes = nodes.slice().sort((a, b) => {
    const ra = IX.get(a.id) || {}, rb = IX.get(b.id) || {};
    return (ra.t || 0) - (rb.t || 0) || (ra.e || 0) - (rb.e || 0);
  });
  for(const n of madeNodes){
    const r = IX.get(n.id);
    const isRef = r && r.s1 === 'refinedresources';
    const city = madeIn(n.id);
    const st = addStop(city, isRef ? 'refine' : 'craft');
    st.make.push({ id: n.id, qty: (need.get(n.id) || 0) * qty, unit: unitOf(n.id) });
    // 이 단계에 들어가는 '사야 하는' 재료는 그 도시에서 집어 든다
    for(const k of n.kids){
      if(crafted.has(k.id)) continue;
      const bp = buyPrice(k.id);
      st.buy.push({ id: k.id, qty: (need.get(k.id) || 0) * qty,
                    unit: bp.v, from: bp.city, hist: bp.hist });
    }
  }
  const sp = sellPrice(sel);
  return { stops, sp, qty, unit: u.cost, cost: u.cost * qty,
           net: sp.net * qty, profit: (sp.net - u.cost) * qty, fee: u.fee * qty };
}

/* ══ 메인 ═══════════════════════════════════════════════════════ */
function render(){
  if(circuitOpen) return renderCircuit();
  if(scanOpen) return renderScan();
  renderSidebar();
  const main = document.getElementById('main');
  const rec = IX.get(sel);
  if(!rec || !rec.r){
    main.innerHTML = `<div class="empty">왼쪽에서 제작할 아이템을 선택하세요.<br>
      <span class="mut">한글 이름으로 검색됩니다 — 예: 판자, 강철 주괴, 스튜, 치유 포션</span></div>`;
    return;
  }
  main.innerHTML = cfgPanel(rec) + '<div id="result"></div>';
  renderResult();
  hydrateIcons(main);
}

          <div class="tw"><div class="nm">${esc(nameOf(r.id))}${
            r.noret ? '<span class="tag nr">반환없음</span>' : ''}</div>
            <div class="id">${esc(r.id)}</div></div>
        </div></td>
        <td>${fmtQ(r.per)}</td>
        <td>${fmtQ(r.need)}</td>
        <td>${priceCell(r.id, r.crafting, u, r.auto)}</td>
        <td>${fmtQ(r.need * c.qty)}</td>
        <td>${isFinite(u) ? fmt(u * r.need * c.qty) : '—'}</td>
        <td style="text-align:center">${r.craftable
          ? (r.auto
              // 살 수 있는 시세가 없어 강제로 제작된 행. 구매로 되돌릴 수 없으니
              // 토글 버튼을 두면 눌러도 상태가 안 바뀌어 먹통처럼 보인다.
              ? `<span class="tag stale" title="살 수 있는 시세가 없어 제작으로 계산합니다. 아래 '가격 직접 입력'에 값을 넣으면 구매로 바꿀 수 있습니다.">자동</span>`
              : `<button class="mini ${r.crafting?'on':''}" data-craft="${esc(r.id)}">${
              (CRAFT_KIND_BTN[r.kind] || '제작') + (r.crafting ? ' 중' : '')}</button>`)
          : '<span class="mut">—</span>'}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>

  <div class="sec">가격 직접 입력 <span class="mut" style="font-weight:400;letter-spacing:0">
    시세가 없거나 실제 거래가와 다를 때 덮어씁니다</span></div>
  <table>
    <thead><tr><th>아이템</th><th>자동 시세</th><th>직접 입력</th><th></th></tr></thead>
    <tbody>
      ${[...new Set([...rows.filter(r => !r.crafting).map(r => r.id)])].map(id => {
        const p = rawPrice(id, cfg.buyCity, 1);
        const auto = p ? (cfg.buyMode==='instant' ? p.s : p.b) : 0;
        return `<tr>
          <td><div class="mat"><img data-ico="${esc(id)}" alt="">
            <div class="tw"><div class="nm">${esc(nameOf(id))}</div>
            <div class="id">${esc(id)}</div></div></div></td>
          <td>${auto ? fmt(auto) : '<span class="stale">없음</span>'}</td>
          <td><input type="number" data-ovr="${esc(id)}" placeholder="자동"
               value="${override.has(id) ? esc(override.get(id)) : ''}"></td>
          <td style="text-align:left"><span class="mut">${p && p.sd ? ago(p.sd) : ''}</span></td>
        </tr>`;
      }).join('')}
      <tr>
        <td><div class="mat"><img data-ico="${esc(sel)}" alt="">
          <div class="tw"><div class="nm">${esc(nameOf(sel))} <span class="tag">판매가</span></div>
          <div class="id">${esc(sel)}</div></div></div></td>
        <td>${isFinite(c.sellUnit) && c.sellUnit ? fmt(c.sellUnit) : '<span class="stale">없음</span>'}</td>
        <td><input type="number" data-ovr="SELL:${esc(sel)}" placeholder="자동"
             value="${override.has('SELL:'+sel) ? esc(override.get('SELL:'+sel)) : ''}"></td>
        <td style="text-align:left"><span class="mut">${c.sp.date ? ago(c.sp.date) : ''}</span></td>
      </tr>
    </tbody>
  </table>

  <div class="note">
    <b>계산 방식</b> · 반환율 = B/(1+B), B = 도시 기본 18% + 특화(정제 40% / 제작 15%)
    + 집중 59% + 일일·추가 보너스. 실소모 재료 = 기본 소모 ÷ (1+B).
    <b>반환없음</b> 표시가 붙은 재료는 게임 데이터(maxreturnamount)가 반환 대상이 아니라고
    명시한 것으로, 아티팩트·토큰·연금 희귀 재료 등이 해당합니다.<br>
    <b>분해</b> · 상위 티어를 하위로 쪼개는 레시피입니다. 집중을 쓰지 않으며,
    반환 여부는 위와 같이 게임 데이터를 따릅니다.<br>
    <b>인챈트 만드는 두 가지 길</b><br>
    ① <b>재료를 올려서 제작</b>(기본) — 게임 원본 레시피 그대로 주재료만 인챈트 단계가 올라가고
    아티팩트 재료(스크롤·송곳니 등)는 .0 이 그대로 들어갑니다. 여기서 "하위 재료 전부 직접 제작"을
    누르면 <b>변환</b> 단계까지 펼쳐져, 일반 자원을 사서 <b>은화를 내고 .0 → .1 → .2 로 직접 올리는</b>
    원가가 계산됩니다. 자원의 인챈트 단계를 올리는 건 룬이 아니라 이 은화 변환입니다.<br>
    ② <b>완성품 + 룬 인챈트</b> — "레시피 선택"에서 고르면, 아래 단계 완제품을 사와서 룬/영혼/유물
    (음식은 피시 소스, 물약은 연금 추출물)로 한 단계만 올립니다. 집중·제작소 사용료·자원 반환이
    전혀 적용되지 않는 별도 공정입니다.<br>
    <b>제작소 사용료</b> · 아이템 가치 × 0.1125 × (사용료 ÷ 100). 아이템 가치는 게임 데이터의
    itemvalue, 없으면 재료 가치 합에서 유도합니다.<br>
    <b>세금</b> · 판매세 ${cfg.premium?'4% (프리미엄)':'8% (비프리미엄)'}${
      setupFee()?' + 판매 주문 등록비 2.5%':''}.<br>
    <b>명성</b>은 소모 재료의 famevalue 합으로 계산한 추정치입니다.<br>
    <b>빈 시세 보완</b> · 고른 도시에 값이 없으면 값이 있는 도시 중 재료는 가장 싼 곳,
    완제품은 가장 비싼 곳 시세를 씁니다(<span class="tag alt">도시명</span> 표시 —
    실제로 사고팔려면 그 도시로 옮겨야 합니다). 어느 도시에도 현재 주문이 없는
    재료는 <span class="tag alt">7일 평균</span> 으로 채웁니다. 완제품 판매가는
    보완하지 않습니다 — 살 사람이 없는데 팔린다고 계산하면 안 되니까요.
    암시장은 가격 성격이 달라 대체 대상에서 뺐습니다.<br>
    <b>7일 평균·거래량</b> · 시세 추이 API(24시간 집계)의 최근 7일을 거래량 가중 평균한 값입니다.
    현재가가 평균에서 30% 이상 벗어나면 <span class="tag stale">평균比</span> 표시가 붙습니다.<br>
    데이터: <a href="https://github.com/ao-data/ao-bin-dumps" target="_blank" rel="noopener">ao-bin-dumps</a>
    (${DATA.meta.generated} 기준, ${fmt(DATA.meta.count)}종) ·
    시세: <a href="https://www.albion-online-data.com/" target="_blank" rel="noopener">Albion Online Data Project</a>.
    Sandbox Interactive GmbH 와 무관한 비공식 도구입니다.
  </div>`;
  hydrateIcons(box);
}

/* ══ 이벤트 ═════════════════════════════════════════════════════ */
let t = null;
const later = (fn, ms=250) => { clearTimeout(t); t = setTimeout(fn, ms); };

/** 다시 그린 뒤 입력 중이던 칸으로 커서를 되돌린다 */
function restoreFocus(fn){
  const a = document.activeElement;
  const k = a && (a.dataset.ovr !== undefined ? `[data-ovr="${CSS.escape(a.dataset.ovr)}"]`
          : a.dataset.cfg ? `[data-cfg="${a.dataset.cfg}"]` : null);
  fn();
  if(!k) return;
  const n = document.querySelector(k);
  if(n && n.focus){
    n.focus();
    if(n.setSelectionRange && n.type !== 'number') n.setSelectionRange(n.value.length, n.value.length);
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');

  // 탐색 결과 행을 누르면 그 아이템 상세로
  const pick = e.target.closest('[data-pick]');
  if(pick && !b){
    sel = pick.dataset.pick; localStorage.setItem('ao_sel', sel);
    if(pick.dataset.q){ cfg.quality = +pick.dataset.q; saveCfg(); }
    scanOpen = false; circuitOpen = false; recipePick.clear();
    document.getElementById('main').scrollTop = 0;
    render(); fetchPrices(); return;
  }

  const row = e.target.closest('.row');
  if(row){ sel = row.dataset.id; localStorage.setItem('ao_sel', sel);
           recipePick.clear(); scanOpen = false; circuitOpen = false;
           document.getElementById('main').scrollTop = 0;
           render(); fetchPrices(); return; }
  if(!b) return;
  if(b.dataset.tab   !== undefined){ tab = b.dataset.tab; renderSidebar(); return; }
  if(b.dataset.tier  !== undefined){ tierF = +b.dataset.tier; renderSidebar(); return; }
  if(b.dataset.ench  !== undefined){ enchF = +b.dataset.ench; renderSidebar(); return; }
  if(b.dataset.craft !== undefined){
    const id = b.dataset.craft;
    craftSet.has(id) ? craftSet.delete(id) : craftSet.add(id);
    saveCraft(); renderResult(); fetchPrices(); return;
  }
  if(b.dataset.recipe !== undefined){
    recipePick.set(sel, +b.dataset.recipe); renderResult(); fetchPrices(); return;
  }
  if(b.dataset.bulk !== undefined){
    if(b.dataset.bulk === 'buy'){ craftSet.clear(); }
    else{
      const walk = (id, depth, seen) => {
        if(seen.has(id)) return;
        seen.add(id);
        const r = recipeOf(id);
        if(!r) return;
        for(const [mid] of r.m){
          // 분해는 제외한다. 상위 재료를 사서 쪼개는 쪽이라 '직접 제작' 과 방향이 반대고,
          // 동물 잔해처럼 분해 레시피가 있는 재료를 전부 켜면 우수한 그림자 발톱(T7) 을
          // 사서 세 번 내리는 식의 원가가 나온다. 개별 행의 '분해' 버튼으로는 여전히 켤 수 있다.
          if(canCraft(mid) && !convertsDown(mid, recipeOf(mid))){
            craftSet.add(mid); walk(mid, depth+1, seen);
          }
        }
        seen.delete(id);
      };
      walk(sel, 0, new Set());
    }
    saveCraft(); renderResult(); fetchPrices(); return;
  }
  if(b.dataset.sort !== undefined){ scanSort = b.dataset.sort; renderScan(); return; }
  if(b.dataset.setqty !== undefined){
    cfg.qty = +b.dataset.setqty; saveCfg(); render(); return;
  }
  if(b.dataset.setsell !== undefined){
    override.set('SELL:' + sel, b.dataset.setsell); saveOvr(); render(); return;
  }
  if(b.dataset.dailyopen !== undefined){
    dailyOpen = b.dataset.dailyopen !== '0';
    scanOpen || circuitOpen ? (circuitOpen ? renderCircuit() : renderScan()) : render();
    return;
  }
  if(b.dataset.dailycat !== undefined){
    const cc = b.dataset.dailycat;
    const cur = dailyLevel(cc);
    cfg.dailyCats = { ...(cfg.dailyCats || {}) };
    if(cur === 0) cfg.dailyCats[cc] = 10;
    else if(cur === 10) cfg.dailyCats[cc] = 20;
    else delete cfg.dailyCats[cc];
    saveCfg();
    scanOpen || circuitOpen ? (circuitOpen ? renderCircuit() : renderScan()) : render();
    return;
  }
  if(b.dataset.dailyclear !== undefined){
    cfg.dailyCats = {}; saveCfg();
    scanOpen || circuitOpen ? (circuitOpen ? renderCircuit() : renderScan()) : render();
    return;
  }
  if(b.dataset.circuitrun !== undefined){ scanOpen = false; runCircuit(); return; }
  if(b.dataset.circuitback !== undefined){ circuitOpen = false; render(); fetchPrices(); return; }
  if(b.dataset.circuitopen !== undefined){ circuitOpen = true; renderCircuit(); return; }
  if(b.dataset.chain !== undefined){
    cfg.chainDepth = b.dataset.chain === 'best' ? 'best' : +b.dataset.chain;
    saveCfg(); runCircuit(); return;
  }
  if(b.dataset.todorun !== undefined){ circuitOpen = false; runTodo(); return; }
  if(b.dataset.scanrun !== undefined){ circuitOpen = false; runScan(); return; }
  if(b.dataset.scanback !== undefined){   // 탐색 화면 → 아이템 계산
    scanOpen = false; render(); fetchPrices(); return;
  }
  if(b.dataset.scanopen !== undefined){   // 아이템 계산 → 보관해 둔 탐색 결과
    scanOpen = true; renderScan(); return;
  }
  if(b.id === 'refresh'){
    priceAt.clear(); hist.clear();          // 새로고침은 캐시를 버리고 다시 받는다
    circuitOpen ? runCircuit() : scanOpen ? runScan() : fetchPrices(true); return;
  }
  const seg = b.closest('[data-seg]');
  if(seg){ cfg[seg.dataset.seg] = b.dataset.v; saveCfg(); render(); return; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'q'){ query = el.value.trim(); later(renderSidebar, 120); return; }
  if(el.id === 'server'){ cfg.server = el.value; saveCfg();
    prices.clear(); priceAt.clear(); hist.clear(); fetchPrices(); return; }
  if(el.dataset.cfg){
    const k = el.dataset.cfg;
    cfg[k] = el.type === 'checkbox' ? el.checked
           : el.type === 'number'   ? (+el.value || 0) : el.value;
    saveCfg();
    const refetch = ['buyCity','sellCity'].includes(k);
    // 숫자 입력은 결과만 갱신 — 입력 칸 DOM 을 유지해야 커서가 제자리에 남는다
    if(el.type === 'number'){
      if(scanOpen){ scanInfo = '설정이 바뀌었습니다 — 다시 탐색하세요'; 
        const n = document.getElementById('scaninfo'); if(n) n.textContent = scanInfo; return; }
      later(renderResult, 250); return;
    }
    later(() => { restoreFocus(() => render()); if(refetch) fetchPrices(); }, 250);
    return;
  }
  if(el.dataset.ovr !== undefined){
    // 값은 즉시 보관하되 재계산은 미룬다 (타이핑 중 커서 튐 방지)
    const id = el.dataset.ovr;
    el.value === '' ? override.delete(id) : override.set(id, el.value);
    saveOvr();
  }
});

/* 입력을 마치면(포커스 이동·Enter) 그때 다시 계산한다 */
document.addEventListener('change', e => {
  if(e.target.dataset.ovr !== undefined){ clearTimeout(t); renderResult(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.ovr !== undefined) e.target.blur();
});

document.getElementById('server').value = cfg.server;
render();
fetchPrices();
</script>
</body>
